name: Python Research Engine

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "python_engine/**"
      - ".github/workflows/python-engine.yml"
  pull_request:
    paths:
      - "python_engine/**"
      - ".github/workflows/python-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_engine/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: pytest -q
