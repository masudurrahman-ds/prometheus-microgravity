name: Build PROMETHEUS Android app

on:
  push:
    branches: [main]
    paths-ignore:
      - update/update.json
  workflow_dispatch: {}

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Validate PROMETHEUS web, NASA dataset, and scientific agent
        run: |
          node scripts/validate_web.mjs
          node --check android/app/src/main/assets/prometheus_ai.js
          cd agent
          node --check server.mjs
          node --check evidence.mjs
          npm test
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
