name: Validate PROMETHEUS repository

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NASA PSI seed JSON
        run: python -m json.tool data/prometheus_nasa_psi_seed.json > /dev/null
      - name: Check required project documentation
        run: |
          test -f README.md
          test -f data/NASA_SOURCES.md
          test -f data/PROMETHEUS_NASA_CITATIONS.md
          test -f PROMETHEUS_BUILD_STATUS.md
      - name: Report Android source status
        run: |
          if [ -f www/index.html ] && [ -f android/gradlew ]; then
            echo "Complete Android/web source tree detected."
          else
            echo "Android/web source tree is not yet complete in GitHub."
            echo "Repository validation passed; Android APK build will be enabled after the full source tree is published."
          fi
