name: PROMETHEUS Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.13'

      - name: Verify Android project
        working-directory: android
        run: |
          gradle --version
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/prometheus_ai.js

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROMETHEUS-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
